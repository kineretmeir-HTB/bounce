<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רשימת ניצחונות עברה</title>
<meta http-equiv="refresh" content="1;url=../nitzahonot/">
</head>
<body style="font-family:sans-serif;background:#fdf8f3;color:#3a3330;text-align:center;padding:40px 16px;">
<p>רשימת הניצחונות עברה לכתובת חדשה...</p>
<p><a href="../nitzahonot/">לחצי כאן אם זה לא קורה לבד</a></p>
<script>
  // מנקה את העותק הישן של הכתובת הזו ומעביר לחדשה
  (async () => {
    try {
      const regs = await navigator.serviceWorker?.getRegistrations() || [];
      await Promise.all(regs.filter(r => r.scope.endsWith('/nitzahon/')).map(r => r.unregister()));
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => /^nitzahon-v\d+$/.test(k)).map(k => caches.delete(k)));
    } catch (e) {}
    location.replace('../nitzahonot/');
  })();
</script>
</body>
</html>
